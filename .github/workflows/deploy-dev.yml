name: Deploy to Dev Environment

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: angular-demo-dev-rg
  APP_NAME: angular-demo-dev
  LOCATION: eastus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.14.X
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Static Web App (Dev)
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: 'upload'
        app_location: 'dist/angular-demo/browser'
        api_location: ''
        skip_app_build: true

    - name: Print deployment summary
      run: |
        echo "✅ Dev deployment completed successfully!"
        echo "📍 URL: https://${{ env.APP_NAME }}.staticwebsites.net"
        echo "🌍 Environment: Development"
        echo "⏰ Timestamp: $(date)"
