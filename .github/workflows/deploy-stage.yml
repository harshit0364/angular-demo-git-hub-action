name: Deploy to Stage Environment

on:
  push:
    branches: [ release ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: angular-demo-stage-rg
  APP_NAME: angular-demo-stage
  LOCATION: eastus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: stage

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.14.X
      uses: actions/setup-node@v4
      with:
        node-version: 24.14.X
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        ENVIRONMENT: staging

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Static Web App (Stage)
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGE }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: 'upload'
        app_location: 'dist/angular-demo'
        output_location: 'dist/angular-demo'
        app_build_command: 'npm run build'
        skip_app_build: true

    - name: Print deployment summary
      run: |
        echo "✅ Stage deployment completed successfully!"
        echo "📍 URL: https://${{ env.APP_NAME }}.staticwebsites.net"
        echo "🌍 Environment: Staging"
        echo "⏰ Timestamp: $(date)"
